<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" rx="32" fill="#1A1512"/>
  <rect x="10" y="10" width="480" height="480" rx="24" fill="#241E19" stroke="#3A2E24" stroke-width="3"/>
  
  <!-- Jersey Silhouette -->
  <!-- Left Sleeve -->
  <path d="M 160 110 L 80 180 L 120 230 L 175 185 Z" fill="#1A1512" stroke="#3A2E24" stroke-width="2"/>
  <path d="M 80 180 L 92 195 L 132 145 L 120 130 Z" fill="#E8944A"/>
  
  <!-- Right Sleeve -->
  <path d="M 340 110 L 420 180 L 380 230 L 325 185 Z" fill="#1A1512" stroke="#3A2E24" stroke-width="2"/>
  <path d="M 420 180 L 408 195 L 368 145 L 380 130 Z" fill="#E8944A"/>
  
  <!-- Main Torso -->
  <path d="M 160 110 L 210 110 C 220 140 280 140 290 110 L 340 110 L 350 400 L 150 400 Z" fill="#161210" stroke="#3A2E24" stroke-width="3"/>
  
  <!-- Side Panels (Amber Trim) -->
  <path d="M 160 180 L 175 185 L 165 400 L 150 400 Z" fill="#E8944A" opacity="0.9"/>
  <path d="M 340 180 L 325 185 L 335 400 L 350 400 Z" fill="#E8944A" opacity="0.9"/>
  
  <!-- Collar V-Neck -->
  <path d="M 210 110 C 225 155 275 155 290 110 L 275 110 C 265 140 235 140 225 110 Z" fill="#E8944A"/>
  
  <!-- Chest Emblem / Badge (Left Chest) -->
  <circle cx="205" cy="175" r="18" fill="#241E19" stroke="#E8944A" stroke-width="2"/>
  <path d="M 205 163 L 209 171 L 218 172 L 211 179 L 213 187 L 205 183 L 197 187 L 199 179 L 192 172 L 201 171 Z" fill="#E8944A"/>
  
  <!-- Brand Logo (Right Chest) -->
  <text x="290" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#E8944A" letter-spacing="1">KS-IDOL</text>

  <!-- Center Sponsor Typography -->
  <rect x="180" y="215" width="140" height="34" rx="6" fill="#241E19" stroke="#3A2E24" stroke-width="1.5"/>
  <text x="250" y="238" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#F5E6D3" text-anchor="middle" letter-spacing="3">KOHI SEKAI</text>
  
  <!-- Number 26 (Large Front) -->
  <text x="250" y="340" font-family="system-ui, sans-serif" font-size="95" font-weight="900" fill="#E8944A" text-anchor="middle" stroke="#161210" stroke-width="3">26</text>
  
  <!-- Sub-label -->
  <text x="250" y="375" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B0A599" text-anchor="middle" letter-spacing="2">OFFICIAL MERCHANDISE</text>
  <rect x="200" y="425" width="100" height="22" rx="11" fill="#E8944A"/>
  <text x="250" y="440" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#1A1512" text-anchor="middle" letter-spacing="1">DRY-FIT 2026</text>
</svg>
