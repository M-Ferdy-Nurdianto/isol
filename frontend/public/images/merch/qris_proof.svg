<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="400" height="600" rx="20" fill="#1A1512"/>
  <rect x="15" y="15" width="370" height="570" rx="16" fill="#241E19" stroke="#3A2E24" stroke-width="2"/>
  
  <!-- Bank / App Header -->
  <rect x="15" y="15" width="370" height="70" rx="16" fill="#1A1512"/>
  <circle cx="50" cy="50" r="18" fill="#E8944A"/>
  <path d="M 43 50 L 48 55 L 58 45" fill="none" stroke="#1A1512" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="46" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#F5E6D3">TRANSAKSI BERHASIL</text>
  <text x="80" y="62" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#6FAE73">QRIS Pembayaran Lunas</text>

  <!-- Merchant Info Box -->
  <rect x="35" y="105" width="330" height="85" rx="12" fill="#1A1512" stroke="#3A2E24" stroke-width="1.5"/>
  <text x="50" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B0A599">Merchant Name:</text>
  <text x="50" y="152" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#E8944A">KOHI SEKAI OFFICIAL</text>
  <text x="50" y="172" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#B0A599">NMID: ID10202611130099</text>

  <!-- Divider Dash Line -->
  <line x1="35" y1="210" x2="365" y2="210" stroke="#3A2E24" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Transaction Details -->
  <g transform="translate(45, 230)">
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#B0A599">Waktu Transaksi</text>
    <text x="310" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5E6D3" text-anchor="end">12 Nov 2026 18:45 WIB</text>

    <text x="0" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#B0A599">Metode Bayar</text>
    <text x="310" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5E6D3" text-anchor="end">QRIS / Instant Settlement</text>

    <text x="0" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#B0A599">Status</text>
    <text x="310" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#6FAE73" text-anchor="end">SUCCESS / VERIFIED</text>

    <text x="0" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#B0A599">No. Referensi (RRN)</text>
    <text x="310" y="125" font-family="system-ui, sans-serif" font-size="10" font-family="monospace" font-weight="700" fill="#B0A599" text-anchor="end">2026111299847120</text>
  </g>

  <!-- Divider Dash Line -->
  <line x1="35" y1="385" x2="365" y2="385" stroke="#3A2E24" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Total Paid Banner -->
  <rect x="35" y="405" width="330" height="70" rx="12" fill="#1A1512" stroke="#E8944A" stroke-width="2"/>
  <text x="50" y="432" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B0A599">TOTAL BAYAR</text>
  <text x="50" y="460" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#E8944A">LUNAS / Rp 255.000</text>
  <text x="350" y="448" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#6FAE73" text-anchor="end">TERVERIFIKASI</text>

  <!-- Footer Notice -->
  <rect x="60" y="515" width="280" height="30" rx="15" fill="#3A2E24"/>
  <text x="200" y="534" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#F5E6D3" text-anchor="middle" letter-spacing="1">BUKTI RESMI KOHI SEKAI SHOP</text>
</svg>
