<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Dark Metal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d16" />
      <stop offset="50%" stop-color="#0d1525" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <!-- Neon Breeze Aura -->
    <radialGradient id="neonGlow" cx="50%" cy="40%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#079108" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#2DD4BF" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#EC4899" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Linear Gradient for Accents -->
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#079108" stop-opacity="0" />
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#079108" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Base Dark Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="800" height="1000" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <rect width="800" height="1000" fill="url(#neonGlow)" />

  <!-- Subtle Ambient Corner Accents -->
  <circle cx="0" cy="0" r="300" fill="#079108" opacity="0.08" filter="blur(60px)" />
  <circle cx="800" cy="1000" r="300" fill="#EC4899" opacity="0.08" filter="blur(60px)" />

  <!-- Tech Lines & Framing -->
  <line x1="60" y1="60" x2="120" y2="60" stroke="#2DD4BF" stroke-width="2" opacity="0.5" />
  <line x1="60" y1="60" x2="60" y2="120" stroke="#2DD4BF" stroke-width="2" opacity="0.5" />
  <line x1="740" y1="60" x2="680" y2="60" stroke="#2DD4BF" stroke-width="2" opacity="0.5" />
  <line x1="740" y1="60" x2="740" y2="120" stroke="#2DD4BF" stroke-width="2" opacity="0.5" />
  
  <line x1="60" y1="940" x2="120" y2="940" stroke="#EC4899" stroke-width="2" opacity="0.5" />
  <line x1="60" y1="940" x2="60" y2="880" stroke="#EC4899" stroke-width="2" opacity="0.5" />
  <line x1="740" y1="940" x2="680" y2="940" stroke="#EC4899" stroke-width="2" opacity="0.5" />
  <line x1="740" y1="940" x2="740" y2="880" stroke="#EC4899" stroke-width="2" opacity="0.5" />

  <!-- Outer Glass Boundary -->
  <rect x="50" y="50" width="700" height="900" rx="32" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Mysterious Idol Silhouette (Sleek & Kawaii Metal) -->
  <g opacity="0.85">
    <!-- Glowing Halo Backing -->
    <circle cx="400" cy="380" r="150" fill="none" stroke="url(#badgeBorder)" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4" />
    <circle cx="400" cy="380" r="170" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

    <!-- Head & Hair Silhouette -->
    <path d="M 330 330 C 330 240, 470 240, 470 330 C 485 360, 485 410, 465 445 C 445 480, 430 480, 400 480 C 370 480, 355 480, 335 445 C 315 410, 315 360, 330 330 Z" fill="#141c2e" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
    
    <!-- Face Shadow Contour -->
    <ellipse cx="400" cy="370" rx="65" ry="80" fill="#182338" />

    <!-- Cute Twin Tails / Hair Flow Suggestion -->
    <path d="M 325 350 C 290 410, 270 510, 300 580 C 310 540, 325 480, 335 430 Z" fill="#111827" opacity="0.7" />
    <path d="M 475 350 C 510 410, 530 510, 500 580 C 490 540, 475 480, 465 430 Z" fill="#111827" opacity="0.7" />

    <!-- Shoulders & Costume Torso Silhouette -->
    <path d="M 270 660 C 270 540, 340 500, 400 500 C 460 500, 530 540, 530 660 L 530 680 L 270 680 Z" fill="#141c2e" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />

    <!-- Cyber / Idol Sparkle Icons -->
    <path d="M 400 240 L 405 255 L 420 260 L 405 265 L 400 280 L 395 265 L 380 260 L 395 255 Z" fill="#2DD4BF" opacity="0.7" />
    <path d="M 490 320 L 493 330 L 503 333 L 493 336 L 490 346 L 487 336 L 477 333 L 487 330 Z" fill="#EC4899" opacity="0.6" />
    <path d="M 305 330 L 308 340 L 318 343 L 308 346 L 305 356 L 302 346 L 292 343 L 302 340 Z" fill="#FBBF24" opacity="0.6" />
  </g>

  <!-- Glowing Separator Line -->
  <line x1="200" y1="695" x2="600" y2="695" stroke="url(#neonLine)" stroke-width="1.5" />

  <!-- Badge Pill: REVEALING SOON / SECRET -->
  <g transform="translate(400, 740)">
    <!-- Pill Base -->
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="rgba(7, 145, 8, 0.12)" stroke="url(#badgeBorder)" stroke-width="1.5" />
    <!-- Glowing Dot -->
    <circle cx="-85" cy="0" r="4" fill="#2DD4BF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-68" y="5" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="13" font-weight="900" fill="#2DD4BF" letter-spacing="3">REVEALING SOON</text>
  </g>

  <!-- Text Section -->
  <!-- Japanese Katakana Accent -->
  <text x="400" y="805" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" fill="#EC4899" text-anchor="middle" letter-spacing="4" opacity="0.9">シークレット・メンバー</text>

  <!-- Main Headline -->
  <text x="400" y="845" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">KOHI SEKAI</text>

  <!-- Subtitle / Concept -->
  <text x="400" y="878" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="rgba(255, 255, 255, 0.5)" text-anchor="middle" letter-spacing="2">OFFICIAL IDOL PROFILE</text>

  <!-- Bottom Tech Watermark -->
  <text x="400" y="915" font-family="monospace" font-size="10" fill="rgba(255, 255, 255, 0.2)" text-anchor="middle" letter-spacing="2">DIGITAL ARCHIVE // KS-SYS-2026</text>
</svg>

